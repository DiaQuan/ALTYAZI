name: Build APKs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APKs (TV + phone)
        run: gradle :tv:assembleDebug :phone:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: oyun-altyazi-tv-debug
          path: tv/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: oyun-dublaj-phone-debug
          path: phone/build/outputs/apk/debug/*.apk
